# GoReleaser configuration for mac-whisper-tool
# See: https://goreleaser.com

version: 2

before:
  hooks:
    # Run tests before building
    - go test ./...
    - go mod tidy

builds:
  - id: mac-whisper-tool
    main: ./main.go
    binary: mac-whisper-tool
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    # Build flags
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE*
      - CLAUDE.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^style:"
      - "typo"
  groups:
    - title: "New Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "Performance Improvements"
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: "Other Changes"
      order: 999

release:
  github:
    owner: dayflower
    name: mac-whisper-tool
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## CLI tool to manage MacWhisper meeting transcriptions

    Download the appropriate binary for your Mac architecture and extract it.

  footer: |
    **Full Changelog**: https://github.com/dayflower/mac-whisper-tool/compare/{{ .PreviousTag }}...{{ .Tag }}

brews:
  - name: mac-whisper-tool
    repository:
      owner: dayflower
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          branch: main
    directory: Formula
    homepage: https://github.com/dayflower/mac-whisper-tool
    description: CLI tool to manage MacWhisper meeting transcriptions (search, list, export, MCP server)
    license: MIT
    install: |
      bin.install "mac-whisper-tool"
